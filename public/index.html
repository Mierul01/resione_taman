<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
    />
    <!-- Home Screen app: draw under the iPhone status bar instead of a white strip. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ResiOne" />
    <meta name="theme-color" content="#0E5A31" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/apple-touch-icon.png" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #0e5a31;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* No double-tap zoom, no text auto-resize on rotate (iOS Safari). */
      html,
      body,
      #root {
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
      }
    </style>
    <script>
      // In a Home Screen app with a translucent status bar, iOS reports a
      // window height that is short by the status bar, leaving an empty band
      // at the bottom. Size the page to the full screen instead.
      (function () {
        if (!window.navigator.standalone) return;
        function fit() {
          var landscape = window.innerWidth > window.innerHeight;
          var h = landscape
            ? Math.min(screen.width, screen.height)
            : Math.max(screen.width, screen.height);
          document.documentElement.style.height = Math.max(h, window.innerHeight) + 'px';
        }
        fit();
        window.addEventListener('resize', fit);
        window.addEventListener('orientationchange', fit);
      })();

      // iOS Safari ignores user-scalable=no for pinch zoom (since iOS 10), but
      // still fires these gesture events, so cancelling them blocks the pinch.
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
        document.addEventListener(type, function (e) {
          e.preventDefault();
        });
      });
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
